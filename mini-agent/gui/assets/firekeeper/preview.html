<!doctype html><meta charset="utf-8"><title>FireKeeper 动画预览</title><style>body{background:#202126;color:#eee;font:15px system-ui;margin:32px}h1{font-size:24px}p{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#303138;border-radius:16px;padding:16px;text-align:center}.pet{width:192px;height:208px;margin:auto;background-image:url('./spritesheet.webp');background-size:1536px 1872px;image-rendering:pixelated}button,select{padding:8px;margin:8px}</style><h1>FireKeeper · 9 组动画</h1><p>作者 VVV · 按原图每行 8 格预览；未确认官方动作名称、有效帧数与时长。</p><button id="pause">暂停</button><select id="speed"><option value="200">5 帧/秒</option><option value="125" selected>8 帧/秒</option><option value="83">12 帧/秒</option></select><p id="status">加载本地精灵图…</p><div class="grid" id="grid"></div><script>let frame=0,playing=true,last=0;for(let row=0;row<9;row++){const card=document.createElement('section');card.className='card';card.innerHTML='<div class="pet" style="background-position:0px -'+row*208+'px"></div><p>动作组 '+(row+1)+'</p>';grid.append(card)}const img=new Image();img.onload=()=>statusText('素材已加载');img.onerror=()=>statusText('本地图片加载失败，请检查素材文件');img.src='./spritesheet.webp';function statusText(t){document.getElementById('status').textContent=t}pause.onclick=()=>{playing=!playing;pause.textContent=playing?'暂停':'播放'};function tick(time){if(playing&&time-last>Number(speed.value)){frame=(frame+1)%8;document.querySelectorAll('.pet').forEach((p,row)=>p.style.backgroundPosition=(-frame*192)+'px '+(-row*208)+'px');last=time}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script>
