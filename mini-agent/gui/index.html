<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#253045;font:15px system-ui}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #dbe0e8;border-radius:8px;background:white;padding:9px 13px;color:inherit}button:hover{background:#eaf0fb}button:disabled{opacity:.45;cursor:default}input,textarea{border:1px solid #dbe0e8;border-radius:8px;padding:10px;background:white;min-width:0}body{display:grid;grid-template-columns:280px 1fr;height:100vh}aside{background:#eef1f6;padding:22px;overflow:auto;border-right:1px solid #dbe0e8}h1{font-size:21px;margin:0 0 5px}small,.muted{color:#738097}h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-top:28px}aside input{width:100%;margin:8px 0}.row{display:flex;gap:8px;align-items:center}.sessions button{display:block;width:100%;text-align:left;margin:7px 0}.selected{border-color:#5b7cce;background:#e2eafa}main{display:flex;flex-direction:column;min-height:0;min-width:0}header{padding:18px 28px;background:white;border-bottom:1px solid #e1e5eb;display:flex;justify-content:space-between;gap:12px}#chat{flex:1;overflow:auto;padding:26px max(24px,calc((100% - 840px)/2))}.message{margin:0 0 24px;line-height:1.7;overflow-wrap:anywhere}.message.user{width:fit-content;max-width:80%;margin-left:auto;margin-right:0;background:#365ec7;color:#fff;border-radius:18px;padding:10px 16px;text-align:left}.message.user>.label{display:none}.message.assistant{margin-left:0;margin-right:auto;background:transparent;border:0;padding:0}.message.user .text{min-width:0}@media(max-width:700px){.message.user{max-width:90%}}.label{font-size:12px;font-weight:650;color:#74819a;margin-bottom:6px}.text{white-space:pre-wrap}details{background:white;border:1px solid #dce2eb;border-radius:9px;margin:10px 0;padding:12px}summary{cursor:pointer;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;background:#f5f6f9;padding:12px;border-radius:6px}.approval{border:1px solid #d6ad56 /* 输入卡片覆盖在消息滚动层上，滚动条保留整列高度。 */

#settingsPanel{height:auto}#showArchives{width:100%;border:0;text-align:left;padding:4px 8px;height:28px}
.session-row{display:flex;align-items:center;position:relative}.session-row>button{flex:1;min-width:0}.session-menu{margin:0;padding:0;border:0;background:transparent}.session-menu>summary{list-style:none;padding:4px;opacity:0}.session-row:hover summary,.session-menu:focus-within summary,.session-menu[open] summary{opacity:1}.session-actions{position:absolute;right:0;z-index:3;min-width:110px;padding:4px;background:white;border-radius:9px;box-shadow:0 3px 12px #0002}#sidebar .session-actions>button{display:block;width:100%;margin:0;padding:5px 9px;border:0;text-align:left;background:transparent}

</style>

<script type="module">
import { renderMarkdown } from "/markdown.js";
const $=id=>document.getElementById(id);let state=null,connected=false,lastSession,folders;const expanded=new Set();
function setSettingsOpen(open){$('settingsPanel').hidden=!open;$('settingsToggle').setAttribute('aria-expanded',String(open));}
$('settingsToggle').onclick=()=>setSettingsOpen($('settingsPanel').hidden);
document.addEventListener('click',e=>{if(!$('settingsPanel').contains(e.target)&&!$('settingsToggle').contains(e.target))setSettingsOpen(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('settingsPanel').hidden){setSettingsOpen(false);$('settingsToggle').focus()}});
function resizeInput(){
  const input=$('input');
  const limit=Math.max(34,Math.min(220,window.innerHeight*.3));
  input.style.height='34px';
  const height=Math.max(34,input.scrollHeight);
  input.style.height=Math.min(height,limit)+'px';
  input.style.overflowY=height>limit?'auto':'hidden';
}
$('input').addEventListener('input',()=>{resizeInput();updateAction()});
window.addEventListener('resize',resizeInput);
function setSidebarCollapsed(collapsed){
 document.body.classList.toggle('sidebar-collapsed',collapsed);
 $('sidebar').inert=collapsed;
 $('sidebar').setAttribute('aria-hidden',String(collapsed));
 const button=$('sidebarToggle'),label=collapsed?'展开侧边栏':'收起侧边栏';
 button.setAttribute('aria-expanded',String(!collapsed));
 button.setAttribute('aria-label',label);button.title=label;
 $('sidebarChevron').setAttribute('d',collapsed?'m13 9 3 3-3 3':'m16 9-3 3 3 3');
 resizeInput();
}
$('sidebarToggle').onclick=()=>{
 const collapsed=!document.body.classList.contains('sidebar-collapsed');
 setSidebarCollapsed(collapsed);
 try{localStorage.setItem('mini-harness.sidebar-collapsed',String(collapsed))}catch{}
};
try{setSidebarCollapsed(localStorage.getItem('mini-harness.sidebar-collapsed')==='true')}catch{}

resizeInput();
// 输入框自动增高或提示换行后，保留等高的消息底部空间。
new ResizeObserver(([entry])=>{
  const chat=$('chat'),atBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<90;
  document.querySelector('main').style.setProperty('--composer-height',document.querySelector('footer').getBoundingClientRect().height+'px');
  if(atBottom)chat.scrollTop=chat.scrollHeight;
}).observe(document.querySelector('footer'));
document.addEventListener('click',event=>{
 for(const menu of document.querySelectorAll('.session-menu[open]')){
  if(!menu.contains(event.target))menu.open=false;
 }
});
document.addEventListener('keydown',event=>{
 if(event.key!=='Escape')return;
 for(const menu of document.querySelectorAll('.session-menu[open]')){
  const restoreFocus=menu.contains(document.activeElement);
  menu.open=false;
  if(restoreFocus)menu.querySelector('summary').focus();
 }
});
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function api(path,data){const r=await fetch('/api/'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||r.statusText);return v}
function task(fn){return async()=>{try{$('error').textContent='';await fn()}catch(e){$('error').textContent=e.message}}}
async function command(path,data){const s=await api(path,data);render(s)}
let workspaceList=[], sessionLists=new Map(), sidebarRequest=0;
let collapsedWorkspaces=new Set();
try{collapsedWorkspaces=new Set(JSON.parse(localStorage.getItem('collapsed-workspaces')||'[]'))}catch{}
function drawWorkspaces(){
 $('workspaces').replaceChildren(...workspaceList.map(w=>{
  const group=el('section'),head=el('div',undefined,'row workspace-heading'),label=el('button',w.title+(w.available?'':' · 不可用')),add=el('button','+');
  const folder=document.createElementNS('http://www.w3.org/2000/svg','svg');
  folder.setAttribute('viewBox','0 0 24 24');folder.setAttribute('aria-hidden','true');folder.classList.add('workspace-folder');
  const outline=document.createElementNS('http://www.w3.org/2000/svg','path');
  outline.setAttribute('d',collapsedWorkspaces.has(w.path)?'M3 9V6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Zm0 0h18':'M3 17V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2M3 19l3-9h16l-3 9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z');
  folder.append(outline);const labelText=el('span',label.textContent);label.replaceChildren(folder,labelText);
  label.title=w.path;label.style.cssText='flex:1;text-align:left;min-width:0;overflow-wrap:anywhere';label.setAttribute('aria-expanded',String(!collapsedWorkspaces.has(w.path)));
  label.onclick=()=>{if(collapsedWorkspaces.has(w.path))collapsedWorkspaces.delete(w.path);else collapsedWorkspaces.add(w.path);try{localStorage.setItem('collapsed-workspaces',JSON.stringify([...collapsedWorkspaces]))}catch{}drawWorkspaces()};
  add.title='新建会话';add.setAttribute('aria-label','在 '+w.title+' 新建会话');add.disabled=!connected||!state?.canSwitch||!w.available;
  add.onclick=task(async()=>{const name=prompt('会话名称','New session');if(name===null)return;collapsedWorkspaces.delete(w.path);await command('create',{cwd:w.path,name});await sessions()});
  head.append(label,add);group.append(head);
  if(!collapsedWorkspaces.has(w.path)){const list=el('div',undefined,'sessions');list.style.paddingLeft='0';for(const item of sessionLists.get(w.path)||[]){const button=el('button',item.name,item.id===state?.session?.id?'selected':'');button.disabled=!connected||!w.available;button.classList.toggle('unread',!!state?.unreadSessions?.includes(item.id));button.title=state?.unreadSessions?.includes(item.id)?'有新的状态变化':'';button.onclick=task(()=>command('view',{id:item.id}));const row=el('div',undefined,'session-row'),menu=el('details',undefined,'session-menu'),summary=el('summary','⋯'),archive=el('button','归档会话');summary.title='会话操作';archive.onclick=task(async()=>{if(!confirm('归档“'+item.name+'”？可在设置中恢复，不会删除工作区文件。'))return;await command('archive',{id:item.id});$('input').value='';resizeInput();await sessions()});const actions=el('div',undefined,'session-actions'),rename=el('button','重命名');rename.disabled=archive.disabled=!connected;rename.onclick=task(async()=>{menu.open=false;const name=prompt('会话名称',item.name);if(name===null)return;await command('rename',{id:item.id,name});await sessions()});actions.append(rename,archive);menu.append(summary,actions);row.append(button,menu);list.append(row)}group.append(list)}
  return group;
 }));
}
async function sessions(){
 const request=++sidebarRequest;
 const workspaces=await api('workspaces');
 const lists=await Promise.all(workspaces.map(async w=>[w.path,w.available?await api('sessions?cwd='+encodeURIComponent(w.path)):[]]));
 if(request!==sidebarRequest)return;
 workspaceList=workspaces;sessionLists=new Map(lists);drawWorkspaces();
}
function render(s){state=s;const chat=$('chat'),bottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<90,scroll=chat.scrollTop;const changed=lastSession!==s.session?.id;if(changed){expanded.clear();lastSession=s.session?.id;sessions().catch(e=>{$('error').textContent=e.message})}
$('title').textContent=s.session?.name||'选择工作区，开始对话';$('notice').textContent=s.notice||'';
updateAction();drawWorkspaces();
const nodes=[],messages=s.session?.messages||[],results=new Map(messages.filter(m=>m.role==='tool').map(m=>[m.toolCallId,m])),decisions=new Map(s.decisions.map(d=>[d.callId,d.outcome]));
function message(role,text){const n=el('section',undefined,'message '+role);const body=el('div',undefined,'text');if(role==='assistant')renderMarkdown(body,(text??'').trimEnd());else body.textContent=text??'';n.append(el('div',role==='user'?'你':'Assistant','label'),body);nodes.push(n);return n}
for(const m of messages){if(m.role==='tool')continue;const n=message(m.role,m.text);for(const c of m.toolCalls||[]){const d=el('details'),r=results.get(c.id);d.open=expanded.has(c.id);d.addEventListener('toggle',()=>{if(d.open)expanded.add(c.id);else expanded.delete(c.id)});d.append(el('summary',c.name+' · '+(decisions.get(c.id)|| (r?(r.isError?'失败':'完成'):(s.status==='running'?'等待 / 执行中':'未完成')))),el('pre',c.arguments));if(r)d.append(el('pre',r.text));n.append(d)}if(m.usage)n.append(el('small',`Tokens: input ${m.usage.inputTokens??'—'} · output ${m.usage.outputTokens??'—'}`))}
if(s.pendingUserText)message('user',s.pendingUserText);if(s.pendingText)message('assistant',s.pendingText);
for(const a of s.approvals){const card=el('section',undefined,'approval');card.append(el('strong','需要审批 · '+a.toolName),el('p',a.reason),el('pre',a.arguments||'未提供参数'));const row=el('div',undefined,'row');for(const [label,outcome]of [['允许一次','allowed-once'],['拒绝','rejected'],['取消审批','cancelled']]){const b=el('button',label);b.disabled=!connected;b.onclick=task(()=>command('approval',{id:a.id,outcome}));row.append(b)}card.append(row);nodes.push(card)}
chat.replaceChildren(...nodes);if(bottom||changed)chat.scrollTop=chat.scrollHeight;else chat.scrollTop=scroll}
async function loadArchives(){
 const items=await api('archives');$('archiveList').replaceChildren();
 const groups=new Map();for(const item of items){if(!groups.has(item.cwd))groups.set(item.cwd,[]);groups.get(item.cwd).push(item)}
 if(!items.length)$('archiveList').append(el('p','暂无已归档会话','muted'));
 for(const [cwd,list] of groups){$('archiveList').append(el('h4',cwd));for(const item of list){const row=el('div',undefined,'archive-row'),info=el('div',item.name+' · '+new Date(item.archivedAt).toLocaleString()),view=el('button','查看'),restore=el('button','恢复');view.onclick=task(async()=>{await command('view',{id:item.id});$('archiveDialog').close()});restore.onclick=task(async()=>{await command('unarchive',{id:item.id});await loadArchives();await sessions()});row.append(info,view,restore);$('archiveList').append(row)}}
}
$('showArchives').onclick=task(async()=>{setSettingsOpen(false);await loadArchives();$('archiveDialog').showModal()});
$('closeArchives').onclick=()=>$('archiveDialog').close();

let actionPending=false;
function isRunning(){return state?.status==='running'||!!state?.approvals?.length}
function updateAction(){
 const button=$('send'),running=isRunning(),hasText=!!$('input').value.trim();
 button.classList.toggle('running',running);
 button.classList.toggle('ready',!running&&hasText&&!state?.archived&&!state?.backgroundBusy);
 button.disabled=!!state?.archived||!!state?.backgroundBusy||actionPending||!connected||(!running&&(!hasText||!state?.session||state.status!=='idle'||state.switchingSession));
 button.setAttribute('aria-label',running?'停止':'发送');button.title=state?.archived?'已归档会话，只读':state?.backgroundBusy?'有工作正在运行':running?'停止':'发送';
 button.innerHTML=running?'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>';
}
async function send(){
 const text=$('input').value;
 if(isRunning()||!text.trim()||$('send').disabled)return;
 actionPending=true;updateAction();
 try{await command('send',{text});if($('input').value===text)$('input').value='';resizeInput()}
 finally{actionPending=false;updateAction()}
}
$('send').onclick=task(async()=>{
 if($('send').disabled)return;
 if(!isRunning())return send();
 actionPending=true;updateAction();
 try{await command('cancel',{})}finally{actionPending=false;updateAction()}
});
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();task(send)()}};
async function dirs(path){folders=await api('directories?path='+encodeURIComponent(path||''));$('dirpath').value=folders.path;$('dirs').replaceChildren(...folders.directories.map(name=>{const b=el('button',name+'/');b.onclick=task(()=>dirs(folders.path+'/'+name));return b}))}
$('addWorkspace').onclick=task(async()=>{await dirs(state?.session?.cwd);$('picker').showModal()});$('parent').onclick=task(()=>dirs(folders.parent));$('goto').onclick=task(()=>dirs($('dirpath').value));$('choose').onclick=task(async()=>{await api('workspaces',{path:$('dirpath').value});$('picker').close();await sessions()});$('closePicker').onclick=()=>$('picker').close();
const events=new EventSource('/api/events');events.onopen=()=>{connected=true;updateAction();sessions().catch(e=>{$('error').textContent=e.message})};events.onmessage=e=>render(JSON.parse(e.data));events.onerror=()=>{connected=false;if(state)render(state)};
</script><script src="/pet/client.js"></script></html>
